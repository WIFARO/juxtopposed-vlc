name: Build release

on:
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: 'Recovery: original full run ID to reuse (blank for a full build)'
        type: string
        default: ''
      completed_build_run_id:
        description: 'Optional: collect rebuilt targets from this completed run instead of rebuilding them'
        type: string
        default: ''
      rebuild_target:
        description: 'Targets to rebuild; failed automatically rebuilds failed or missing targets'
        type: choice
        default: all
        options:
          - all
          - failed
          - macos-x86_64
          - macos-arm64
          - linux-x86_64
          - win64
      create_draft:
        description: 'Create a draft release and version tag at this commit after verification'
        type: boolean
        default: false
      bypass_cache:
        description: 'Build dependencies afresh without restoring or saving caches'
        type: boolean
        default: false
      macos_arm_runner:
        description: 'Apple Silicon runner image; select another image if GitHub cannot allocate a runner'
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-14
          - macos-26
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read
  actions: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

env:
  JOBS: '4'
  QT_VERSION: '6.8.3'
  AQT_VERSION: '3.3.0'
  WINDOWS_BUILD_IMAGE: registry.videolan.org/vlc-debian-win64-posix@sha256:8e83e800036f8f4a6da1031a6b80c2b5bad8337259c072ffa22398baaeaad880

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      recovery: ${{ steps.plan.outputs.recovery }}
      reuse: ${{ steps.plan.outputs.reuse }}
      rebuild_targets: ${{ steps.plan.outputs.rebuild_targets }}
      previous_run: ${{ steps.plan.outputs.previous_run }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
      macos_matrix: ${{ steps.plan.outputs.macos_matrix }}
      build_macos: ${{ steps.plan.outputs.build_macos }}
      build_linux: ${{ steps.plan.outputs.build_linux }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
      reuse_matrix: ${{ steps.plan.outputs.reuse_matrix }}
      reuse_origins: ${{ steps.plan.outputs.reuse_origins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          version=$(python3 extras/package/release/version.py)
          test -s "doc/releases/$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
          python3 -m unittest discover -s extras/package/release/tests
      - name: Plan builds and validate recovery source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          COMPLETED_BUILD_RUN_ID: ${{ inputs.completed_build_run_id }}
          REBUILD_TARGET: ${{ inputs.rebuild_target || 'all' }}
          CREATE_DRAFT: ${{ inputs.create_draft }}
          MACOS_ARM_RUNNER: ${{ inputs.macos_arm_runner || 'macos-15' }}
        run: python3 extras/package/release/recovery.py plan

  reuse:
    needs: prepare
    if: needs.prepare.outputs.reuse == 'true'
    name: reuse (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.reuse_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ matrix.artifact_id }}
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          path: reused
          merge-multiple: true
      - name: Verify reused package version, source and checksum
        env:
          REBUILD_TARGET: ${{ matrix.target }}
          REUSED_SOURCE_COMMIT: ${{ matrix.source_commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: python3 extras/package/release/recovery.py validate --directory reused
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: reused/*
          if-no-files-found: error

  macos:
    needs: prepare
    if: needs.prepare.outputs.build_macos == 'true'
    name: macos (${{ matrix.runner }}, ${{ matrix.arch }})
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate Homebrew downloads cache
        id: brew-cache
        run: |
          echo "path=$(brew --cache)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Homebrew downloads
        if: ${{ !inputs.bypass_cache }}
        id: brew-restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ steps.brew-cache.outputs.path }}
          key: release-brew-downloads-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.brew-cache.outputs.week }}
          restore-keys: release-brew-downloads-v1-${{ matrix.runner }}-${{ matrix.arch }}-
      - name: Install dependencies
        run: |
          # Current Homebrew formulas often have no Intel macOS bottles.
          # Explicitly permit source builds; already installed packages are reused.
          source_options=()
          if [[ "$(uname -m)" == x86_64 ]]; then
            source_options+=(--build-from-source)
          fi
          brew install "${source_options[@]}" meson ninja cmake pkg-config python bison flex gettext \
            ffmpeg lua gnutls libarchive libpng freetype harfbuzz fribidi \
            libass libgcrypt dav1d opus libvorbis flac mpg123 x264 libmatroska libebml taglib libdvbpsi
      - name: Save Homebrew downloads
        if: ${{ !inputs.bypass_cache && steps.brew-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ steps.brew-cache.outputs.path }}
          key: release-brew-downloads-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.brew-cache.outputs.week }}
      - name: Restore pinned Qt SDK
        if: ${{ !inputs.bypass_cache }}
        id: qt-restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: build-release-qt
          key: release-qt-sdk-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ env.QT_VERSION }}-${{ env.AQT_VERSION }}-qtshadertools
      - name: Install pinned Qt SDK
        env:
          QT_CACHE_RESTORE_RESULT: ${{ steps.qt-restore.outcome }}
        run: |
          sdk="$GITHUB_WORKSPACE/build-release-qt/$QT_VERSION/macos"
          if [[ "$QT_CACHE_RESTORE_RESULT" != success ]]; then
            rm -rf build-release-qt
          fi
          if [[ ! -x "$sdk/bin/qmake" ]] ||
             [[ "$("$sdk/bin/qmake" -query QT_VERSION 2>/dev/null || true)" != "$QT_VERSION" ]] ||
             [[ ! -f "$sdk/lib/cmake/Qt6ShaderTools/Qt6ShaderToolsConfig.cmake" ]]; then
            rm -rf build-release-qt
            python3 -m venv build-release-tools
            build-release-tools/bin/pip install "aqtinstall==$AQT_VERSION"
            build-release-tools/bin/aqt install-qt mac desktop "$QT_VERSION" clang_64 -O build-release-qt -m qtshadertools
          fi
          echo "QT_ROOT_DIR=$sdk" >> "$GITHUB_ENV"
      - name: Save pinned Qt SDK
        if: ${{ !inputs.bypass_cache && steps.qt-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build-release-qt
          key: release-qt-sdk-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ env.QT_VERSION }}-${{ env.AQT_VERSION }}-qtshadertools
      - name: Build and bundle
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: bash extras/package/release/build-native.sh
      - name: Verify relocated app
        run: |
          mkdir -p "$RUNNER_TEMP/relocated app"
          ditto -x -k build-release-output/vlc-juxtopposed-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.zip "$RUNNER_TEMP/relocated app"
          python3 extras/package/release/verify.py --expected-version "$RELEASE_TAG" --gui --video "$RUNNER_TEMP/relocated app/VLC Juxtopposed.app/Contents/MacOS/vlc"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}
          path: |
            build-release-output/*.zip
            build-release-output/*.sha256
            build-release-output/*.json
          if-no-files-found: error

  linux:
    needs: prepare
    if: needs.prepare.outputs.build_linux == 'true'
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
        continue-on-error: true
      - name: Build environment
        id: environment
        uses: docker/build-push-action@v6
        continue-on-error: true
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: extras/package/release/Dockerfile.linux
          tags: vlc-release-linux
          load: true
          pull: true
          no-cache: ${{ inputs.bypass_cache || false }}
          cache-from: ${{ !inputs.bypass_cache && 'type=gha,scope=vlc-release-linux-x86_64-v1' || '' }}
          cache-to: ${{ !inputs.bypass_cache && 'type=gha,scope=vlc-release-linux-x86_64-v1,mode=max,ignore-error=true' || '' }}
      - name: Retry environment without external caches
        if: steps.environment.outcome != 'success'
        env:
          BUILDX_BUILDER: default
        run: docker build --pull --no-cache -t vlc-release-linux -f extras/package/release/Dockerfile.linux .
      - name: Build and bundle
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: >-
          docker run --rm -v "$PWD:/src" -e JOBS -e RELEASE_TAG
          -e OPENSUBTITLES_API_KEY
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src
          vlc-release-linux bash extras/package/release/build-native.sh
      - name: Install playback test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth weston libgl1-mesa-dri libegl1 libegl-mesa0 libglx-mesa0
      - name: Verify relocated directory bundle
        run: |
          mkdir -p "$RUNNER_TEMP/relocated"
          tar -xzf build-release-output/vlc-juxtopposed-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz -C "$RUNNER_TEMP/relocated"
          python3 extras/package/release/bundle-linux-runtime.py --verify-only "$RUNNER_TEMP/relocated/AppDir"
          QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            python3 extras/package/release/verify.py --expected-version "$RELEASE_TAG" --gui --video --require-opengl "$RUNNER_TEMP/relocated/AppDir/AppRun"
      - name: Verify native Wayland playback
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --use-pixman --socket=wayland-release --idle-time=0 --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            [[ -S "$XDG_RUNTIME_DIR/wayland-release" ]] && break
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/wayland-release" ]]; then
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          fi
          QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=wayland-release LIBGL_ALWAYS_SOFTWARE=1 \
            QT_WAYLAND_CLIENT_BUFFER_INTEGRATION=wayland-egl \
            python3 extras/package/release/verify.py --expected-version "$RELEASE_TAG" --gui --video --require-opengl "$RUNNER_TEMP/relocated/AppDir/AppRun"
      - name: Verify software-rendering fallback
        run: >-
          QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software xvfb-run -a
          python3 extras/package/release/verify.py --expected-version "$RELEASE_TAG" --gui --video
          "$RUNNER_TEMP/relocated/AppDir/AppRun"
      - name: Verify newer Linux graphics stack without system Qt
        run: |
          docker run --rm --cpus=2 --memory=2g \
            --mount "type=bind,source=$RUNNER_TEMP/relocated,target=/release,readonly" \
            --mount "type=bind,source=$PWD/extras/package/release,target=/src/extras/package/release,readonly" \
            ubuntu:24.04 bash /src/extras/package/release/verify-linux-container.sh "$RELEASE_TAG" /release/AppDir
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.version }}-linux-x86_64
          path: |
            build-release-output/*.tar.gz
            build-release-output/*.sha256
            build-release-output/*-build.json
          if-no-files-found: error

  windows:
    needs: prepare
    if: needs.prepare.outputs.build_windows == 'true'
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make room for Windows contrib compilation
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Fingerprint Windows dependencies
        id: deps-key
        run: python3 extras/package/release/dependency-cache.py key
      - name: Restore Windows dependency SDK
        if: ${{ !inputs.bypass_cache }}
        id: deps-restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ steps.deps-key.outputs.paths }}
          key: ${{ steps.deps-key.outputs.key }}
      - name: Restore Windows dependency downloads
        if: ${{ !inputs.bypass_cache }}
        id: downloads-restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: contrib/tarballs
          key: ${{ steps.deps-key.outputs.download_key }}
          restore-keys: release-win64-downloads-v1-
      - name: Prepare Windows dependencies
        id: dependencies
        env:
          RELEASE_DEPS_CACHE_KEY: ${{ steps.deps-key.outputs.key }}
        run: |
          # No app API key is passed to this dependency-only build or its cache.
          docker run --rm --user root -v "$PWD:/src" -w /src -e JOBS \
            -e RELEASE_DEPS_CACHE_KEY \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            "$WINDOWS_BUILD_IMAGE" bash extras/package/release/build-windows.sh --dependencies-only
          if [[ -f build-release-cache/windows-dependencies.json ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save Windows dependency SDK
        if: ${{ !inputs.bypass_cache && steps.deps-restore.outputs.cache-hit != 'true' && steps.dependencies.outputs.ready == 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ steps.deps-key.outputs.paths }}
          key: ${{ steps.deps-key.outputs.key }}
      - name: Save Windows dependency downloads
        if: ${{ !inputs.bypass_cache && steps.downloads-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: contrib/tarballs
          key: ${{ steps.deps-key.outputs.download_key }}
      - name: Build and package portable archive
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          RELEASE_DEPS_CACHE_KEY: ${{ steps.deps-key.outputs.key }}
        run: >-
          docker run --rm --user root -v "$PWD:/src" -w /src -e JOBS -e RELEASE_TAG
          -e OPENSUBTITLES_API_KEY -e RELEASE_DEPS_CACHE_KEY
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src
          "$WINDOWS_BUILD_IMAGE"
          bash extras/package/release/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.version }}-win64
          path: |
            build-release-output/*.zip
            build-release-output/*.sha256
            build-release-output/*-build.json
          if-no-files-found: error

  windows-smoke:
    needs: [prepare, windows]
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.version }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.version }}-win64
          path: downloads
      - shell: pwsh
        run: |
          Expand-Archive downloads/vlc-juxtopposed-${{ needs.prepare.outputs.version }}-win64.zip "$env:RUNNER_TEMP/relocated"
          $vlc = "$env:RUNNER_TEMP/relocated/vlc-win64/vlc.exe"
          python extras/package/release/version.py "$env:RELEASE_TAG" --executable $vlc --require-module qt --require-module avcodec --require-module medialibrary
          if ($LASTEXITCODE -ne 0) { throw 'Compiled version or required plugin verification failed' }
          python -c "import wave; w=wave.open('sample.wav','wb'); w.setparams((1,2,48000,0,'NONE','not compressed')); w.writeframes(b'\0\0'*96000); w.close()"
          $sample = (Resolve-Path sample.wav).Path
          # Reuse the portable profile to exercise the cached graphics probe.
          foreach ($attempt in 1..2) {
            $log = "$env:RUNNER_TEMP/vlc-smoke-$attempt.log"
            $process = Start-Process $vlc -ArgumentList '--ignore-config','-vv','-I','qt','--no-video','--aout=dummy','--no-qt-privacy-ask','--no-qt-updates-notif','--no-media-library','--no-metadata-network-access','--play-and-exit','--file-logging',"--logfile=$log",$sample -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'VLC startup timed out' }
            if ($process.ExitCode -ne 0) { throw "VLC exited $($process.ExitCode)" }
            $messages = Get-Content $log -Raw
            if ($messages -notmatch 'using interface module "qt"') { throw 'Qt interface did not start' }
            if ($messages -notmatch 'using audio decoder module') { throw 'Audio decoder did not start' }
            if ($messages -match 'failed to load component|QQmlApplicationEngine failed|is not installed|qml loading|Cannot load the VLC interface|svg icon plugin is not found|Scene Graph Error|Failed to create RHI|Failed to initialize graphics backend') { throw 'Qt interface reported a startup failure' }
          }

  draft:
    needs: [prepare, reuse, macos, linux, windows, windows-smoke]
    # Recovery intentionally skips the targets being reused. Do not let those
    # skips suppress aggregation, or allow a failure/cancellation to look green.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      PREVIOUS_RUN_ID: ${{ needs.prepare.outputs.previous_run }}
      REBUILD_TARGET: ${{ needs.prepare.outputs.rebuild_targets }}
      REUSED_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      REUSE_ORIGINS: ${{ needs.prepare.outputs.reuse_origins }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare provenance and checksums
        run: python3 extras/package/release/recovery.py assemble
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.version }}-complete
          path: downloads/*
          overwrite: true
      # Manual runs only create artifacts unless explicitly asked for a draft.
      # Publication remains an explicit action by the maintainer.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 extras/package/release/recovery.py publish
