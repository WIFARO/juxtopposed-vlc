name: Wil native PiP regression

on:
  push:
    branches: [wil/player-customization]
    paths:
      - .github/workflows/wil-native.yml
      - extras/package/wil/native/**
      - modules/gui/qt/tests/test_dcomp_detached_pip.cpp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Qt base SDK with hash verification
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --archives qtbase -O "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE -ne 0) { throw 'Qt SDK installation failed' }
      - name: Compile real native DComp test
        shell: pwsh
        run: |
          cmake -S extras/package/wil/native -B "$env:RUNNER_TEMP/wil-native-build" -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64"
          if ($LASTEXITCODE -ne 0) { throw 'Native test configuration failed' }
          cmake --build "$env:RUNNER_TEMP/wil-native-build" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native test compilation failed' }
      - name: Run native two-window visual-transfer regression
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin;$env:PATH"
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/plugins/platforms"
          ctest --test-dir "$env:RUNNER_TEMP/wil-native-build" -C Release --output-on-failure --output-junit "$env:RUNNER_TEMP/wil-native-results.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Native DComp regression failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wil-native-pip-test-results
          path: |
            ${{ runner.temp }}/wil-native-results.xml
            ${{ runner.temp }}/wil-native-build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
